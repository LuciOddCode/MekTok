name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            solution: MekTok.sln
          - os: ubuntu-latest
            solution: MekTok.CrossPlatform.slnf
          - os: macos-latest
            solution: MekTok.CrossPlatform.slnf
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run xUnit Tests
        run: dotnet test ${{ matrix.solution }} -c Release

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish WPF Executable (win-x64)
        run: >
          dotnet publish src/MekTok.App/MekTok.App.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/MekTok.exe -DestinationPath publish/MekTok-win-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: |
            publish/win-x64/MekTok.exe
            publish/MekTok-win-x64.zip

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Desktop Binary (linux-x64)
        run: >
          dotnet publish src/MekTok.Desktop/MekTok.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained
          -o publish/linux-x64

      - name: Verify Self-Test
        run: publish/linux-x64/MekTok --self-test

      - name: Build .deb, .AppImage, and .tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then VERSION="2.0.0"; fi
          chmod +x packaging/linux/build-deb.sh packaging/linux/build-appimage.sh
          ./packaging/linux/build-deb.sh publish/linux-x64 "${VERSION}" "publish/MekTok-${VERSION}-linux-x64.deb" amd64
          ./packaging/linux/build-appimage.sh publish/linux-x64 "${VERSION}" "publish/MekTok-${VERSION}-linux-x64.AppImage"
          tar -C publish/linux-x64 -czf "publish/MekTok-${VERSION}-linux-x64.tar.gz" .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            publish/*.deb
            publish/*.AppImage
            publish/*.tar.gz

  build-macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Desktop Binary (${{ matrix.rid }})
        run: >
          dotnet publish src/MekTok.Desktop/MekTok.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -o publish/${{ matrix.rid }}

      - name: Verify Self-Test
        run: publish/${{ matrix.rid }}/MekTok --self-test

      - name: Build .app Bundle Archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then VERSION="2.0.0"; fi
          chmod +x packaging/macos/build-app-bundle.sh
          ./packaging/macos/build-app-bundle.sh "publish/${{ matrix.rid }}" "${VERSION}" "${PWD}/publish/MekTok-${VERSION}-${{ matrix.rid }}.zip"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-${{ matrix.rid }}
          path: publish/*.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
