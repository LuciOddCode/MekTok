name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Tests
        run: dotnet test MekTok.sln -c Release

      - name: Publish Single-File Executable
        run: >
          dotnet publish src/MekTok.App/MekTok.App.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/MekTok.exe -DestinationPath publish/MekTok-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            publish/MekTok.exe
            publish/MekTok-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true

